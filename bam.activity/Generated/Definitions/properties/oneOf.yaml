Name: oneOf
Uri: https://www.w3.org/ns/activitystreams#oneOf
Notes: >-
  Identifies an exclusive option for a Question. Use of
              oneOf implies that the Question can have only a single answer. To indicate that a Question can have multiple answers, use
              anyOf.
Domain: Question
Range:
  - Object
  - Link
IsFunctional: false
SubPropertyOf: 
