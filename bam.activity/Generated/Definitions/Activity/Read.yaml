Name: Read
Uri: https://www.w3.org/ns/activitystreams#Read
Notes: >-
  Indicates that the actor has read the
                object.
Extends: Activity
Properties: []
Examples:
  - >-
    {
      "@context": "https://www.w3.org/ns/activitystreams",
      "summary": "Sally read a blog post",
      "type": "Read",
      "actor": {
        "type": "Person",
        "name": "Sally"
      },
      "object": "http://example.org/posts/1"
    }
