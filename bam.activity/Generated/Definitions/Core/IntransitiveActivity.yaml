Name: IntransitiveActivity
Uri: https://www.w3.org/ns/activitystreams#IntransitiveActivity
Notes: >-
  Instances of IntransitiveActivity are a subtype of
              Activity representing intransitive actions. The
              object property is therefore inappropriate for these activities.
Extends: Activity
Properties: []
Example: >-
  {
    "@context": "https://www.w3.org/ns/activitystreams",
    "type": "Travel",
    "summary": "Sally went to work",
    "actor": {
      "type": "Person",
      "name": "Sally"
    },
    "target": {
      "type": "Place",
      "name": "Work"
    }
  }
