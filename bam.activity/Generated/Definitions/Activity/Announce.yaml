Name: Announce
Uri: https://www.w3.org/ns/activitystreams#Announce
Notes: "Indicates that the actor is calling the target's attention the object.\n              \n              \n                The origin typically has no defined meaning."
Extends: Activity
Properties: []
Examples:
  - >-
    {
      "@context": "https://www.w3.org/ns/activitystreams",
      "summary": "Sally announced that she had arrived at work",
      "type": "Announce",
      "actor": {
        "type": "Person",
        "id": "http://sally.example.org",
        "name": "Sally"
      },
      "object": {
        "type": "Arrive",
        "actor": "http://sally.example.org",
        "location": {
          "type": "Place",
          "name": "Work"
        }
      }
    }
