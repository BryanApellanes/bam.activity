Name: CollectionPage
Uri: https://www.w3.org/ns/activitystreams#CollectionPage
Notes: >-
  Used to represent distinct subsets of items from a
                Collection. Refer to the
                Activity Streams 2.0 Core for a complete description of the
                CollectionPage object.
Extends: Collection
Properties:
  - partOf
  - next
  - prev
Examples:
  - >-
    {
      "@context": "https://www.w3.org/ns/activitystreams",
      "summary": "Page 1 of Sally's notes",
      "type": "CollectionPage",
      "id": "http://example.org/foo?page=1",
      "partOf": "http://example.org/foo",
      "items": [
        {
          "type": "Note",
          "name": "A Simple Note"
        },
        {
          "type": "Note",
          "name": "Another Simple Note"
        }
      ]
    }
