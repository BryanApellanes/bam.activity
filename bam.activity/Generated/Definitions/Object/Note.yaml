Name: Note
Uri: https://www.w3.org/ns/activitystreams#Note
Notes: Represents a short written work typically less than a single paragraph in length.
Extends: Object
Properties: []
Example: >-
  {
    "@context": "https://www.w3.org/ns/activitystreams",
