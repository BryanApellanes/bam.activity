Name: context
Uri: https://www.w3.org/ns/activitystreams#context
Notes: "Identifies the context within which the object exists or an activity was performed.\n            \n            \n              The notion of \"context\" used is intentionally vague. The intended function is to serve as a means of grouping objects and activities that share a common originating context or purpose. An example could be all activities relating to a common project or event."
Domain: Object
Range:
