Name: Leave
Uri: https://www.w3.org/ns/activitystreams#Leave
Notes: >-
  Indicates that the actor has left the
                object. The target and
                origin typically have no meaning.
Extends: Activity
Properties: []
Example: >-
  {
    "@context": "https://www.w3.org/ns/activitystreams",
    "summary": "Sally left work",
    "type": "Leave",
    "actor": {
      "type": "Person",
      "name": "Sally"
    },
    "object": {
      "type": "Place",
      "name": "Work"
    }
  }{
    "@context": "https://www.w3.org/ns/activitystreams",
    "summary": "Sally left a group",
    "type": "Leave",
    "actor": {
      "type": "Person",
      "name": "Sally"
    },
    "object": {
      "type": "Group",
      "name": "A Simple Group"
    }
  }
